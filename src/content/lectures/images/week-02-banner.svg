<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w2title">
  <title id="w2title">Causal self-attention across a token sequence</title>
  <rect width="1200" height="400" fill="#101322" />
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#e8ecff">
    <text x="140" y="150" font-size="30" text-anchor="middle">t1</text>
    <text x="340" y="150" font-size="30" text-anchor="middle">t2</text>
    <text x="540" y="150" font-size="30" text-anchor="middle">t3</text>
    <text x="740" y="150" font-size="30" text-anchor="middle">t4</text>
    <rect x="880" y="112" width="90" height="52" rx="8" fill="none" stroke="#7fa8ff" stroke-width="3" />
    <text x="925" y="150" font-size="30" fill="#7fa8ff" text-anchor="middle">t5</text>
  </g>
  <g fill="#9fb2e8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" text-anchor="middle">
    <circle cx="140" cy="200" r="16" fill="#2a3358" /><text x="140" y="206">1</text>
    <circle cx="340" cy="200" r="16" fill="#2a3358" /><text x="340" y="206">2</text>
    <circle cx="540" cy="200" r="16" fill="#2a3358" /><text x="540" y="206">3</text>
    <circle cx="740" cy="200" r="16" fill="#2a3358" /><text x="740" y="206">4</text>
    <circle cx="925" cy="200" r="16" fill="#2a3358" /><text x="925" y="206">5</text>
  </g>
  <defs>
    <marker id="w2arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7fa8ff" />
    </marker>
  </defs>
  <g stroke="#7fa8ff" stroke-width="2.5" fill="none" opacity="0.85" marker-end="url(#w2arrow)">
    <path d="M340,220 C300,250 200,250 156,222" />
    <path d="M540,220 C480,260 200,260 156,222" />
    <path d="M540,220 C500,245 380,245 356,222" />
    <path d="M740,220 C650,270 200,270 156,222" />
    <path d="M740,220 C680,255 400,255 356,222" />
    <path d="M740,220 C700,240 580,240 556,222" />
    <path d="M925,220 C800,285 200,285 156,222" />
    <path d="M925,220 C820,265 400,265 356,222" />
    <path d="M925,220 C840,250 580,250 556,222" />
    <path d="M925,220 C880,235 780,235 756,222" />
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#9fb2e8" font-size="20">
    <text x="140" y="330">causal mask: each position attends only to itself and earlier positions</text>
  </g>
  <g stroke="#e05a5a" stroke-width="2" stroke-dasharray="6 5" opacity="0.7">
    <path d="M156,150 C400,60 700,60 900,150" fill="none" />
  </g>
  <text x="530" y="55" font-size="18" fill="#c8888a" text-anchor="middle">no forward attention</text>
</svg>
