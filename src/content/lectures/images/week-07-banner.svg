<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w7title">
  <title id="w7title">Pairwise response preference feeding a policy-and-reference relationship</title>
  <rect width="1200" height="400" fill="#101322" />
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="80" y="90" font-size="22" fill="#9fb2e8">same prompt, two candidate responses</text>

    <rect x="80" y="120" width="330" height="110" rx="10" fill="none" stroke="#2a3358" stroke-width="3" />
    <text x="105" y="155" font-size="22" fill="#e8ecff">Response A</text>
    <text x="105" y="190" font-size="16" fill="#9fb2e8">"the story wanders off-topic"</text>

    <rect x="80" y="250" width="330" height="110" rx="10" fill="none" stroke="#7fa8ff" stroke-width="3" />
    <text x="105" y="285" font-size="22" fill="#e8ecff">Response B</text>
    <text x="105" y="320" font-size="16" fill="#c8d3ff">"the story stays on task"</text>

    <g stroke="#7fa8ff" stroke-width="3" fill="none">
      <path d="M 410 305 L 470 200" marker-end="url(#arrow)" />
    </g>
    <text x="420" y="230" font-size="20" fill="#7fa8ff">preferred</text>

    <circle cx="560" cy="240" r="42" fill="none" stroke="#7fa8ff" stroke-width="3" />
    <text x="560" y="246" font-size="18" fill="#e8ecff" text-anchor="middle">B ≻ A</text>

    <g stroke="#9fb2e8" stroke-width="2.5" fill="none">
      <path d="M 602 240 L 720 190" marker-end="url(#arrowmuted)" />
      <path d="M 602 240 L 720 290" marker-end="url(#arrowmuted)" />
    </g>

    <rect x="730" y="150" width="230" height="80" rx="10" fill="none" stroke="#e8ecff" stroke-width="3" />
    <text x="755" y="185" font-size="22" fill="#e8ecff">policy model</text>
    <text x="755" y="212" font-size="16" fill="#9fb2e8">being updated</text>

    <rect x="730" y="250" width="230" height="80" rx="10" fill="none" stroke="#6a7597" stroke-width="2.5" stroke-dasharray="6,5" />
    <text x="755" y="285" font-size="22" fill="#c8d3ff">reference model</text>
    <text x="755" y="312" font-size="16" fill="#6a7597">held fixed (KL anchor)</text>

    <g stroke="#6a7597" stroke-width="2" fill="none">
      <path d="M 960 190 L 1030 220" />
      <path d="M 960 290 L 1030 220" />
    </g>
    <text x="1020" y="215" font-size="16" fill="#9fb2e8">bounded</text>
    <text x="1000" y="235" font-size="16" fill="#9fb2e8">divergence</text>

    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#7fa8ff" />
      </marker>
      <marker id="arrowmuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#9fb2e8" />
      </marker>
    </defs>
  </g>
</svg>
