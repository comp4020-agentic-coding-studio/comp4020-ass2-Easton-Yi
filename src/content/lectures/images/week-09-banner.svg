<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w9title">
  <title id="w9title">Three reasoning chains converging on a verified answer</title>
  <rect width="1200" height="400" fill="#101322" />
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="90" y="60" font-size="22" fill="#9fb2e8">sampled chain-of-thought candidates</text>

    <!-- Chain A: agrees -->
    <g>
      <circle cx="110" cy="120" r="14" fill="none" stroke="#7fa8ff" stroke-width="3" />
      <circle cx="200" cy="110" r="14" fill="none" stroke="#7fa8ff" stroke-width="3" />
      <circle cx="290" cy="130" r="14" fill="none" stroke="#7fa8ff" stroke-width="3" />
      <line x1="124" y1="120" x2="186" y2="112" stroke="#7fa8ff" stroke-width="2" />
      <line x1="214" y1="111" x2="276" y2="128" stroke="#7fa8ff" stroke-width="2" />
      <line x1="304" y1="130" x2="560" y2="188" stroke="#7fa8ff" stroke-width="2" />
      <text x="330" y="115" font-size="16" fill="#c8d3ff">chain A</text>
    </g>

    <!-- Chain B: agrees -->
    <g>
      <circle cx="110" cy="200" r="14" fill="none" stroke="#7fa8ff" stroke-width="3" />
      <circle cx="200" cy="205" r="14" fill="none" stroke="#7fa8ff" stroke-width="3" />
      <circle cx="290" cy="195" r="14" fill="none" stroke="#7fa8ff" stroke-width="3" />
      <line x1="124" y1="200" x2="186" y2="204" stroke="#7fa8ff" stroke-width="2" />
      <line x1="214" y1="205" x2="276" y2="197" stroke="#7fa8ff" stroke-width="2" />
      <line x1="304" y1="195" x2="560" y2="198" stroke="#7fa8ff" stroke-width="2" />
      <text x="330" y="185" font-size="16" fill="#c8d3ff">chain B</text>
    </g>

    <!-- Chain C: disagrees, dashed/muted -->
    <g>
      <circle cx="110" cy="290" r="14" fill="none" stroke="#2a3358" stroke-width="3" />
      <circle cx="200" cy="300" r="14" fill="none" stroke="#2a3358" stroke-width="3" />
      <circle cx="290" cy="280" r="14" fill="none" stroke="#2a3358" stroke-width="3" />
      <line x1="124" y1="290" x2="186" y2="299" stroke="#2a3358" stroke-width="2" stroke-dasharray="6 5" />
      <line x1="214" y1="300" x2="276" y2="282" stroke="#2a3358" stroke-width="2" stroke-dasharray="6 5" />
      <line x1="304" y1="280" x2="560" y2="220" stroke="#2a3358" stroke-width="2" stroke-dasharray="6 5" />
      <text x="330" y="270" font-size="16" fill="#6d7aa8">chain C (minority)</text>
    </g>

    <!-- Verification box -->
    <rect x="570" y="150" width="220" height="100" rx="10" fill="none" stroke="#7fa8ff" stroke-width="3" />
    <text x="600" y="190" font-size="20" fill="#e8ecff">majority</text>
    <text x="600" y="215" font-size="20" fill="#e8ecff">vote check</text>

    <line x1="790" y1="200" x2="880" y2="200" stroke="#7fa8ff" stroke-width="3" />
    <polygon points="880,193 895,200 880,207" fill="#7fa8ff" />

    <!-- Final verified answer -->
    <rect x="900" y="160" width="230" height="80" rx="10" fill="#7fa8ff" opacity="0.15" stroke="#7fa8ff" stroke-width="3" />
    <text x="925" y="195" font-size="20" fill="#e8ecff">verified</text>
    <text x="925" y="220" font-size="20" fill="#e8ecff">final answer</text>
  </g>
</svg>
