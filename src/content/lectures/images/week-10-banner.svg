<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w10title">
  <title id="w10title">Training records flowing through a model, parser, and verifier</title>
  <rect width="1200" height="400" fill="#101322" />
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#e8ecff">
    <!-- task contract -->
    <rect x="60" y="170" width="180" height="90" rx="10" fill="none" stroke="#9fb2e8" stroke-width="3" />
    <text x="85" y="205" font-size="18">task</text>
    <text x="85" y="230" font-size="18">contract</text>

    <line x1="150" y1="170" x2="150" y2="120" stroke="#9fb2e8" stroke-width="2" stroke-dasharray="5 4" />
    <text x="80" y="105" font-size="15" fill="#9fb2e8">defines shape of</text>

    <!-- training records -->
    <rect x="290" y="170" width="180" height="90" rx="10" fill="none" stroke="#7fa8ff" stroke-width="3" />
    <text x="315" y="205" font-size="18">training</text>
    <text x="315" y="230" font-size="18">records</text>

    <line x1="470" y1="215" x2="540" y2="215" stroke="#7fa8ff" stroke-width="3" />
    <polygon points="540,208 555,215 540,222" fill="#7fa8ff" />

    <!-- model -->
    <rect x="560" y="170" width="150" height="90" rx="10" fill="#7fa8ff" opacity="0.15" stroke="#7fa8ff" stroke-width="3" />
    <text x="590" y="222" font-size="20" fill="#e8ecff">model</text>

    <line x1="710" y1="215" x2="780" y2="215" stroke="#7fa8ff" stroke-width="3" />
    <polygon points="780,208 795,215 780,222" fill="#7fa8ff" />

    <!-- output parser -->
    <rect x="800" y="170" width="170" height="90" rx="10" fill="none" stroke="#7fa8ff" stroke-width="3" />
    <text x="822" y="205" font-size="18">output</text>
    <text x="822" y="230" font-size="18">parser</text>

    <line x1="970" y1="215" x2="1040" y2="215" stroke="#7fa8ff" stroke-width="3" />
    <polygon points="1040,208 1055,215 1040,222" fill="#7fa8ff" />

    <!-- verifier / metric -->
    <rect x="1060" y="150" width="120" height="130" rx="10" fill="none" stroke="#7fa8ff" stroke-width="3" />
    <text x="1078" y="200" font-size="17">verifier</text>
    <text x="1078" y="225" font-size="17">/ metric</text>

    <text x="290" y="150" font-size="16" fill="#9fb2e8">annotated task-specific examples</text>
  </g>
</svg>
