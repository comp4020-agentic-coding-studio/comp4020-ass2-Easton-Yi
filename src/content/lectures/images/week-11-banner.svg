<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w11title">
  <title id="w11title">One aggregate score beside uneven per-slice scores</title>
  <rect width="1200" height="400" fill="#101322" />
  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#e8ecff">
    <text x="90" y="60" font-size="20" fill="#9fb2e8">aggregate score</text>
    <rect x="90" y="90" width="120" height="220" rx="6" fill="#7fa8ff" opacity="0.35" />
    <rect x="90" y="150" width="120" height="160" rx="6" fill="#7fa8ff" />
    <text x="110" y="140" font-size="18" fill="#e8ecff">0.82</text>

    <line x1="260" y1="320" x2="260" y2="90" stroke="#2a3358" stroke-width="2" stroke-dasharray="4 5" />

    <text x="320" y="60" font-size="20" fill="#9fb2e8">disaggregated by slice</text>

    <!-- slice bars, uneven heights -->
    <g>
      <rect x="320" y="200" width="70" height="110" rx="6" fill="#2a3358" />
      <rect x="320" y="220" width="70" height="90" rx="6" fill="#7fa8ff" />
      <text x="325" y="330" font-size="14" fill="#9fb2e8">base</text>
    </g>
    <g>
      <rect x="410" y="130" width="70" height="180" rx="6" fill="#2a3358" />
      <rect x="410" y="150" width="70" height="160" rx="6" fill="#7fa8ff" />
      <text x="400" y="330" font-size="14" fill="#9fb2e8">paraphrase</text>
    </g>
    <g>
      <rect x="500" y="250" width="70" height="60" rx="6" fill="#2a3358" />
      <rect x="500" y="270" width="70" height="40" rx="6" fill="#ff9f7f" />
      <text x="500" y="330" font-size="14" fill="#ff9f7f">template shift</text>
    </g>
    <g>
      <rect x="590" y="90" width="70" height="220" rx="6" fill="#2a3358" />
      <rect x="590" y="110" width="70" height="200" rx="6" fill="#7fa8ff" />
      <text x="595" y="330" font-size="14" fill="#9fb2e8">in-domain</text>
    </g>
    <g>
      <rect x="680" y="270" width="70" height="40" rx="6" fill="#2a3358" />
      <rect x="680" y="285" width="70" height="25" rx="6" fill="#ff9f7f" />
      <text x="680" y="330" font-size="14" fill="#ff9f7f">held-out slice</text>
    </g>

    <text x="900" y="150" font-size="18" fill="#9fb2e8">one number can</text>
    <text x="900" y="180" font-size="18" fill="#9fb2e8">hide two failing</text>
    <text x="900" y="210" font-size="18" fill="#9fb2e8">subgroups</text>
  </g>
</svg>
